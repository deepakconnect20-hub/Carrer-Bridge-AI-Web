        /* ========================================================================
           ASSESSMENT PAGE (Interactive 5-Step Quiz)
           ======================================================================== */
        function AssessmentPage({ assessmentAnswers, setAssessmentAnswers, onComplete }) {
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const question = ASSESSMENT_QUESTIONS[currentQIndex];

            const handleSelectOption = (val) => {
                setAssessmentAnswers({
                    ...assessmentAnswers,
                    [question.id]: val
                });
            };

            const progressPct = ((currentQIndex + 1) / ASSESSMENT_QUESTIONS.length) * 100;

            return (
                <div className="max-w-3xl mx-auto px-4 py-12 flex-1 w-full flex flex-col justify-center">
                    <div className="bg-white rounded-3xl border border-slate-200 p-8 shadow-lg">
                        {/* Header & Progress */}
                        <div className="mb-8">
                            <div className="flex justify-between items-center mb-3">
                                <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Question {currentQIndex + 1} of {ASSESSMENT_QUESTIONS.length}</span>
                                <span className="text-xs text-slate-500 font-semibold">{Math.round(progressPct)}% Completed</span>
                            </div>
                            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                                <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: `${progressPct}%` }}></div>
                            </div>
                        </div>

                        {/* Question */}
                        <div className="mb-8">
                            <span className="text-xs bg-purple-50 text-purple-700 px-3 py-1 rounded-full font-semibold mb-3 inline-block">{question.category}</span>
                            <h2 className="text-2xl font-extrabold text-slate-900 mt-2">{question.question}</h2>
                        </div>

                        {/* Options */}
                        <div className="space-y-3 mb-8">
                            {question.options.map((opt, idx) => {
                                const isSelected = assessmentAnswers[question.id] === opt.value;
                                return (
                                    <div
                                        key={idx}
                                        onClick={() => handleSelectOption(opt.value)}
                                        className={`p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                                            isSelected
                                                ? 'border-indigo-600 bg-indigo-50/50 text-indigo-900 font-semibold shadow-xs'
                                                : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'
                                        }`}
                                    >
                                        <span className="text-sm">{opt.label}</span>
                                        <div className={`w-5 h-5 rounded-full border flex items-center justify-center ${isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'}`}>
                                            {isSelected && <span className="text-xs">✓</span>}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Navigation Buttons */}
                        <div className="flex justify-between items-center pt-6 border-t border-slate-100">
                            <button
                                disabled={currentQIndex === 0}
                                onClick={() => setCurrentQIndex(currentQIndex - 1)}
                                className={`px-5 py-2.5 rounded-xl text-sm font-semibold border ${currentQIndex === 0 ? 'opacity-40 cursor-not-allowed border-slate-200 text-slate-400' : 'border-slate-300 text-slate-700 hover:bg-slate-50'}`}
                            >
                                Previous
                            </button>
                            {currentQIndex < ASSESSMENT_QUESTIONS.length - 1 ? (
                                <button
                                    onClick={() => setCurrentQIndex(currentQIndex + 1)}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-md"
                                >
                                    Next Question →
                                </button>
                            ) : (
                                <button
                                    onClick={onComplete}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-7 py-2.5 rounded-xl text-sm font-semibold shadow-md"
                                >
                                    Submit Assessment & View Results 🎉
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

                                    <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">

        /* ========================================================================
           AI CAREER ASSISTANT CHATBOT
           ======================================================================== */
        function AiAssistantPage({ chatMessages, setChatMessages, chatInput, setChatInput, isAiTyping, setIsAiTyping }) {
            const chatEndRef = useRef(null);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [chatMessages, isAiTyping]);

            const handleSend = (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;

                const userMsg = chatInput;
                const newMsgs = [...chatMessages, { sender: 'user', text: userMsg }];
                setChatMessages(newMsgs);
                setChatInput('');
                setIsAiTyping(true);

                // Simulate intelligent AI response
                setTimeout(() => {
                    let aiReply = "Based on your student profile in rural education, I recommend focusing on foundational subjects like Mathematics and Computer Science, and exploring government scholarships such as the National Merit Scholarship.";
                    const lower = userMsg.toLowerCase();
                    if (lower.includes('software') || lower.includes('coding')) {
                        aiReply = "Software Development is an excellent high-demand career! Start with freeCodeCamp or Python basics, build 3 practical projects, and target B.Tech or BCA degrees.";
                    } else if (lower.includes('12th science') || lower.includes('after 12th')) {
                        aiReply = "After 12th Science, you have versatile pathways including B.Tech (Engineering), MBBS (Doctor), BCA/B.Sc Computer Science, or B.Sc Nursing. Take our Career Assessment to find your exact match!";
                    } else if (lower.includes('scholarship')) {
                        aiReply = "We have several verified scholarships listed in our Scholarship module, such as the National Merit Rural Scholarship (up to ₹25,000/year) and Digital Empowerment Girls Scholarship.";
                    }

                    setChatMessages([...newMsgs, { sender: 'ai', text: aiReply }]);
                    setIsAiTyping(false);
                }, 1000);
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 flex-1 w-full flex flex-col h-[calc(100vh-140px)]">
                    <div className="mb-4">
                        <h1 className="text-2xl font-extrabold text-slate-900">CareerBridge AI Assistant</h1>
                        <p className="text-xs text-slate-600">Ask any career, education, or scholarship question. Powered by modular AI service.</p>
                    </div>

                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm flex-1 flex flex-col overflow-hidden">
                        {/* Chat Messages */}
                        <div className="flex-1 p-6 overflow-y-auto space-y-4">
                            {chatMessages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] p-4 rounded-2xl text-sm leading-relaxed ${
                                        msg.sender === 'user'
                                            ? 'bg-indigo-600 text-white rounded-br-xs'
                                            : 'bg-slate-100 text-slate-800 rounded-bl-xs border border-slate-200'
                                    }`}>
                                        {msg.text}
                                    </div>
                                </div>
                            ))}
                            {isAiTyping && (
                                <div className="flex justify-start">
                                    <div className="bg-slate-100 text-slate-500 p-4 rounded-2xl text-xs flex items-center space-x-2">
                                        <span className="w-2 h-2 rounded-full bg-indigo-600 animate-bounce"></span>
                                        <span className="w-2 h-2 rounded-full bg-indigo-600 animate-bounce delay-100"></span>
                                        <span className="w-2 h-2 rounded-full bg-indigo-600 animate-bounce delay-200"></span>
                                        <span>CareerBridge AI is thinking...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={chatEndRef} />
                        </div>

                        {/* Suggested Prompts */}
                        <div className="px-6 py-2 bg-slate-50 border-t border-slate-200 flex gap-2 overflow-x-auto text-xs">
                            {[
                                "What career is suitable for me?",
                                "What can I do after 12th science?",
                                "Which skills should I learn for software development?",
                                "What scholarships are available?"
                            ].map((prompt, i) => (
                                <button
                                    key={i}
                                    onClick={() => setChatInput(prompt)}
                                    className="whitespace-nowrap bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-slate-700 hover:bg-slate-100 font-medium"
                                >
                                    {prompt}
                                </button>
                            ))}
                        </div>

                        {/* Input Box */}
                        <form onSubmit={handleSend} className="p-4 bg-white border-t border-slate-200 flex gap-3">
                            <input
                                type="text"
                                placeholder="Ask your career question here..."
                                value={chatInput}
                                onChange={(e) => setChatInput(e.target.value)}
                                className="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-hidden focus:ring-2 focus:ring-indigo-500"
                            />
                            <button
                                type="submit"
                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md text-sm transition-colors"
                            >
                                Send
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

                    </div>

                    {/* Quick Actions & Recommended Next Step */}

                            <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">

                                    <span className="text-xs font-bold text-indigo-700 bg-white px-2.5 py-1 rounded-md">Priority Action</span>
                                    <h4 className="font-bold text-indigo-900 text-lg mt-2">Explore Your Personalized Career Roadmap</h4>
                                    <p className="text-xs text-indigo-700 mt-1">Check off completed steps from Class 12 foundation to internship readiness.</p>
                                </div>
                                <button
                                    onClick={() => setCurrentTab('roadmap')}

                                >
                                    View Roadmap →
                                </button>
                            </div>

                            <h4 className="font-bold text-slate-900 pt-2">Quick Navigation Actions</h4>

        /* ========================================================================
           ROADMAP PAGE
           ======================================================================== */
        function RoadmapPage({ roadmapSteps, setRoadmapSteps, showToast }) {
            const toggleStep = (id) => {
                const updated = roadmapSteps.map(s => s.id === id ? { ...s, completed: !s.completed } : s);
                setRoadmapSteps(updated);
                showToast("Roadmap progress updated!");
            };

            const completedCount = roadmapSteps.filter(s => s.completed).length;
            const pct = Math.round((completedCount / roadmapSteps.length) * 100);

            return (
                <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full space-y-8">
                    <div>
                        <h1 className="text-3xl font-extrabold text-slate-900">Personalized Career Roadmap</h1>
                        <p className="text-slate-600 mt-1">Step-by-step interactive guidance from foundational studies to career success.</p>
                    </div>

                    <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs flex justify-between items-center">
                        <div>
                            <div className="text-sm font-bold text-slate-700">Overall Roadmap Progress</div>
                            <div className="text-2xl font-extrabold text-indigo-600 mt-0.5">{pct}% Completed ({completedCount} of {roadmapSteps.length} steps)</div>
                        </div>
                        <div className="w-32 bg-slate-100 h-3 rounded-full overflow-hidden">
                            <div className="bg-indigo-600 h-full transition-all" style={{ width: `${pct}%` }}></div>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {roadmapSteps.map((step, idx) => (
                            <div
                                key={step.id}
                                onClick={() => toggleStep(step.id)}
                                className={`p-6 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${
                                    step.completed
                                        ? 'bg-emerald-50/40 border-emerald-300 text-slate-800'
                                        : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-800'
                                }`}
                            >
                                <div className="flex items-center space-x-4">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${step.completed ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                        {idx + 1}
                                    </div>
                                    <div>
                                        <h4 className={`font-bold text-base ${step.completed ? 'line-through text-slate-500' : 'text-slate-900'}`}>{step.title}</h4>
                                        <p className="text-xs text-slate-500">{step.completed ? 'Completed Milestone' : 'Click to mark as complete'}</p>
                                    </div>
                                </div>
                                <div className={`w-6 h-6 rounded-full border flex items-center justify-center ${step.completed ? 'border-emerald-600 bg-emerald-600 text-white' : 'border-slate-300'}`}>
                                    {step.completed && <span className="text-xs font-bold">✓</span>}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
